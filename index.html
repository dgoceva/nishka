<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Нишка – ателие за ленени дрехи. Демо сайт на виртуална фирма.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Нишка ателие</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: редакционна витрина — тъмна индиго лента с „тъкан“ банер, после светли секции на решетка */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#E8EAE6; --ink:#1B2133; --muted:#5B6274;
  --line:#D6D9DE; --indigo:#26345C; --rose:#B03E66; --on-rose:#FFFFFF; --ok:#2F7A55;
  --hero-a:#151C30; --hero-b:#24325A; --hero-ink:#F1F2F6; --hero-muted:#AEB6CE; --hero-line:rgba(241,242,246,.18);
  --shadow:0 18px 40px -22px rgba(20,28,50,.45);
  --f-display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1320; --surface:#181D2C; --surface-2:#20263A; --ink:#ECEEF4; --muted:#A3AABB;
  --line:#2B3247; --indigo:#A9BBEA; --rose:#E27FA1; --on-rose:#1A0E14; --ok:#6CC69A;
  --shadow:0 18px 40px -22px rgba(0,0,0,.8); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#181D2C; --surface-2:#20263A; --ink:#ECEEF4; --muted:#A3AABB;
  --line:#2B3247; --indigo:#A9BBEA; --rose:#E27FA1; --on-rose:#1A0E14; --ok:#6CC69A;
  --shadow:0 18px 40px -22px rgba(0,0,0,.8); color-scheme:dark }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.08;margin:0;text-wrap:balance}
h2{font-size:clamp(2rem,4.5vw,3.2rem)}
h3{font-size:1.45rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.eyebrow{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--rose)}
.lead{color:var(--muted);max-width:60ch;margin-top:12px}
section{padding-block:clamp(56px,9vw,104px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:32px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:12px 22px;font-weight:600;font-size:.95rem;text-decoration:none;transition:transform .2s,background .2s,color .2s,border-color .2s}
.btn:hover{transform:translateY(-2px)}
.btn-rose{background:var(--rose);color:var(--on-rose)}
.btn-line{border-color:currentColor;background:transparent}
.btn-sm{padding:8px 14px;font-size:.85rem}

/* ---- Бягаща лента ---- */
.marquee{background:var(--rose);color:var(--on-rose);overflow:hidden;font-size:.8rem;font-weight:500;letter-spacing:.04em;padding-block:8px}
.marquee-track{display:flex;width:max-content;animation:slide 32s linear infinite}
.marquee-track span{padding-inline:22px;white-space:nowrap}
.marquee-track span::after{content:"✦";margin-left:44px;opacity:.7}
@keyframes slide{to{transform:translateX(-50%)}}

/* ---- Хедър ---- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo svg{width:34px;height:34px;color:var(--rose)}
.logo b{font-family:var(--f-display);font-size:1.7rem;letter-spacing:.22em;font-weight:600}
.logo small{display:block;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:-4px}
nav.main{display:flex;gap:26px}
nav.main a{text-decoration:none;font-weight:500;font-size:.95rem;position:relative}
nav.main a::after{content:"";position:absolute;left:0;right:100%;bottom:-4px;height:1.5px;background:var(--rose);transition:right .25s}
nav.main a:hover::after{right:0}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative}
.icon-btn svg{width:20px;height:20px}
.count{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--rose);color:var(--on-rose);font-size:.7rem;font-weight:600;display:grid;place-items:center;padding-inline:5px}
.count.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.35)}}
#menuBtn{display:none}
.mobile-nav{border-top:1px solid var(--line);padding-block:12px}
.mobile-nav a{display:block;padding-block:12px;text-decoration:none;font-size:1.1rem;font-weight:500;border-bottom:1px solid var(--line)}
@media (max-width:820px){ nav.main{display:none} #menuBtn{display:grid} }

/* ---- Банер ---- */
.hero{position:relative;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);overflow:hidden;padding-block:clamp(48px,8vw,90px)}
.weave{position:absolute;inset:-40px;opacity:.18;pointer-events:none;
  background:
   repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.25) 9px 10px),
   repeating-linear-gradient(0deg,transparent 0 9px,rgba(255,255,255,.12) 9px 10px);
  animation:drift 24s linear infinite}
@keyframes drift{to{transform:translate(40px,40px)}}
.thread{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.thread path{fill:none;stroke:var(--rose);stroke-width:2;stroke-dasharray:1400;stroke-dashoffset:1400;animation:sew 4.5s .3s ease-out forwards}
@keyframes sew{to{stroke-dashoffset:0}}
.hero-in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,64px);align-items:center}
.hero h1{font-size:clamp(2.8rem,7.5vw,5.6rem);font-weight:500}
.hero h1 em{display:block;color:var(--rose);font-style:italic;min-height:1.1em}
.hero h1 em span{display:inline-block;animation:wordIn .7s cubic-bezier(.2,.7,.2,1)}
@keyframes wordIn{from{opacity:0;transform:translateY(.4em) rotate(-2deg)}}
.hero p{color:var(--hero-muted);max-width:46ch;margin-top:20px;font-size:1.08rem}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero .btn-line{color:var(--hero-ink)}
.stage{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:200px 200px 18px 18px;overflow:hidden;border:1px solid var(--hero-line);background:rgba(255,255,255,.04)}
.slide{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity 1.1s}
.slide.on{opacity:1}
.slide svg{width:74%;height:auto;filter:drop-shadow(0 30px 30px rgba(0,0,0,.35))}
.slide.on svg{animation:kenburns 7s ease-out both}
@keyframes kenburns{from{transform:scale(1.12) translateY(12px)}to{transform:scale(1) translateY(0)}}
.slide-cap{position:absolute;left:0;right:0;bottom:0;padding:22px 24px;background:linear-gradient(transparent,rgba(10,14,26,.75))}
.slide-cap small{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--hero-muted)}
.slide-cap div{font-family:var(--f-display);font-size:1.7rem;font-style:italic}
.dots{position:absolute;top:22px;right:22px;display:flex;gap:6px;z-index:2}
.dots button{width:26px;height:4px;border:0;border-radius:2px;background:var(--hero-line);padding:0}
.dots button.on{background:var(--hero-ink)}
@media (max-width:820px){ .hero-in{grid-template-columns:1fr} .stage{max-width:420px;width:100%;margin:0 auto} }

/* ---- Колекция ---- */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{display:flex;flex-direction:column;gap:12px}
.card-art{position:relative;aspect-ratio:4/5;max-width:100%;background:radial-gradient(circle at 50% 42%,var(--surface) 0%,var(--surface-2) 70%);border-radius:var(--r);display:grid;place-items:center;overflow:hidden;border:0;padding:0;width:100%}
.card-art svg{width:68%;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .card-art svg{transform:scale(1.07) rotate(-2deg)}
.card-art .qv{position:absolute;left:12px;right:12px;bottom:12px;background:var(--surface);color:var(--ink);border-radius:999px;padding:10px;font-weight:600;font-size:.85rem;transform:translateY(140%);transition:transform .3s}
.card:hover .qv,.card-art:focus-visible .qv{transform:none}
@media (hover:none){ .card-art .qv{transform:none} }
.badge{position:absolute;top:12px;left:12px;background:var(--rose);color:var(--on-rose);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.badge.new{background:var(--ink);color:var(--bg)}
.card-row{display:flex;justify-content:space-between;align-items:start;gap:10px}
.card h3{font-size:1.3rem}
.card .cat{font-size:.78rem;color:var(--muted)}
.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.price s{color:var(--muted);font-weight:400;margin-left:6px;font-size:.88em}
.add{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;line-height:1}
.add:hover{background:var(--rose);color:var(--on-rose);border-color:var(--rose)}

/* ---- Създай визия ---- */
.studio{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.studio-in{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(24px,5vw,60px);align-items:center}
.mannequin{background:var(--surface-2);border-radius:var(--r);aspect-ratio:3/4;max-width:100%;display:grid;place-items:center;position:relative}
.mannequin svg{height:92%;width:auto}
.mannequin g{transition:opacity .3s}
.mannequin .swap{animation:pop .45s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.pick{margin-top:22px}
.pick h4{margin:0 0 10px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 14px 8px 8px;font-size:.88rem;text-align:left}
.sw i{width:28px;height:28px;border-radius:8px;border:1px solid rgba(0,0,0,.12);flex:none}
.sw[aria-pressed="true"]{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose)}
.sw small{display:block;color:var(--muted);font-variant-numeric:tabular-nums}
.total-box{margin-top:26px;padding-top:20px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.total-box .sum{font-size:1.9rem;font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums}
.total-box .sum s{font-size:1.1rem;color:var(--muted);margin-right:8px;font-family:var(--f-body);font-weight:400}
.total-box small{display:block;color:var(--ok);font-weight:500}
@media (max-width:820px){ .studio-in{grid-template-columns:1fr} .mannequin{max-width:360px;width:100%;margin:0 auto} }

/* ---- Снимки ---- */
.card-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.card:hover .card-art img{transform:scale(1.06)}
.card-art .badge,.card-art .qv{z-index:1}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.on img{animation:kenburns 7s ease-out both}
.modal-art{position:relative;overflow:hidden}
.modal-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb{position:relative;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* ---- Лукбук ---- */
.lookbook{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lb-nav{display:flex;gap:8px}
.lb-track{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding-left:max(16px, env(safe-area-inset-left,0px), calc((100% - 1180px)/2 + 16px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:4px 8px;scroll-padding-left:max(16px, calc((100% - 1180px)/2 + 16px))}
.lb-track::-webkit-scrollbar{display:none}
.look{flex:none;width:clamp(250px,30vw,380px);aspect-ratio:3/4;margin:0;position:relative;border-radius:var(--r);overflow:hidden;scroll-snap-align:start;background:var(--surface-2)}
.look img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.look:hover img{transform:scale(1.05)}
.look figcaption{position:absolute;left:0;right:0;bottom:0;padding:60px 16px 16px;background:linear-gradient(transparent,rgba(10,14,26,.82));color:#fff;display:grid;gap:10px}
.look figcaption b{font-family:var(--f-display);font-size:1.7rem;font-style:italic;font-weight:600;line-height:1.1}
.look-buy{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:12px;padding:10px 14px;font-size:.88rem}
.look-buy .go{grid-column:1/-1;font-weight:600;font-size:.8rem;opacity:.85}
.look-buy:hover{background:rgba(255,255,255,.26)}
.about-photos{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:32px}
.about-photos img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r);max-width:100%}
.about-photos img:nth-child(2){margin-top:40px}
/* ---- Брояч ---- */
.launch{background:linear-gradient(color-mix(in srgb,var(--indigo) 84%,transparent),color-mix(in srgb,var(--indigo) 84%,transparent)),var(--launch-img,none) center/cover,var(--indigo);color:var(--bg);border-radius:24px;padding:clamp(28px,5vw,52px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
.launch .eyebrow{color:inherit;opacity:.75}
.launch h2{font-size:clamp(1.8rem,3.6vw,2.6rem);margin-top:8px}
.launch p{opacity:.85;margin-top:10px;max-width:50ch}
.clock{display:flex;gap:10px}
.clock div{min-width:74px;text-align:center;border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);border-radius:14px;padding:12px 6px}
.clock b{display:block;font-family:var(--f-display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.clock span{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
@media (max-width:820px){ .launch{grid-template-columns:1fr} .clock div{min-width:0;flex:1} }

/* ---- За нас ---- */
.about-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,6vw,72px)}
.about-in .story{font-family:var(--f-display);font-size:clamp(1.35rem,2.4vw,1.75rem);line-height:1.4;font-style:italic;margin-top:20px}
.numbers{display:flex;gap:28px;margin-top:32px;flex-wrap:wrap}
.numbers b{display:block;font-family:var(--f-display);font-size:3rem;line-height:1;color:var(--rose)}
.numbers span{font-size:.85rem;color:var(--muted)}
.values{display:grid;gap:0}
.values div{padding-block:18px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:4px 18px}
.values div:last-child{border-bottom:1px solid var(--line)}
.values i{font-style:normal;font-family:var(--f-display);font-size:1.1rem;color:var(--rose);grid-row:span 2;padding-top:2px}
.values h3{font-size:1.3rem}
.values p{color:var(--muted);font-size:.95rem}
@media (max-width:820px){ .about-in{grid-template-columns:1fr} }
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-top:56px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px}
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem;font-weight:600;color:#fff;margin-bottom:8px}
.person b{font-size:1.02rem}
.person span{font-size:.8rem;color:var(--rose);font-weight:600;letter-spacing:.04em}
.person p{font-size:.9rem;color:var(--muted)}

/* ---- Контакти ---- */
.contact-in{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,6vw,72px)}
.cinfo{display:grid;gap:18px;margin-top:28px}
.cinfo small{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cinfo div{font-size:1.05rem;font-weight:500;user-select:all}
.social{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
form.cform{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,34px);display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label{font-size:.85rem;font-weight:500}
.field input,.field textarea,.field select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.field textarea{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-radius:10px;padding:12px 14px;font-weight:500}
@media (max-width:820px){ .contact-in{grid-template-columns:1fr} }
@media (max-width:480px){ .two{grid-template-columns:1fr} }

footer{border-top:1px solid var(--line);padding-block:36px;color:var(--muted);font-size:.85rem}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---- Модал и количка ---- */
.overlay{position:fixed;inset:0;background:rgba(10,14,26,.55);z-index:60;backdrop-filter:blur(3px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:auto;background:var(--surface);border-radius:22px;display:grid;grid-template-columns:1fr 1fr;animation:rise .35s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translate(-50%,-46%)}}
.modal-art{background:var(--surface-2);display:grid;place-items:center;min-height:420px}
.modal-art svg{width:70%}
.modal-body{padding:30px;display:flex;flex-direction:column;gap:14px;position:relative}
.modal-body h3{font-size:2rem;padding-right:40px}
.modal-body .meta{font-size:.85rem;color:var(--muted)}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.size{min-width:48px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:500;font-size:.9rem}
.size[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.close{position:absolute;top:16px;right:16px}
@media (max-width:680px){ .modal{grid-template-columns:1fr} .modal-art{min-height:220px} .modal-art svg{width:46%} }

.drawer{position:fixed;z-index:61;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--surface);display:flex;flex-direction:column;animation:drawerIn .35s cubic-bezier(.2,.7,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes drawerIn{from{transform:translateX(100%)}}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-size:1.7rem}
.drawer-body{flex:1;overflow:auto;padding:8px 22px}
.line{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.line .thumb{width:64px;height:76px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center}
.line .thumb svg{width:70%}
.line b{display:block;font-size:.95rem}
.line small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg);line-height:1}
.drawer-foot{padding:18px 22px;border-top:1px solid var(--line);display:grid;gap:10px}
.promo{display:flex;gap:8px}
.promo input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-transform:uppercase}
.sumrow{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:.95rem}
.sumrow.total{font-size:1.25rem;font-weight:600;padding-top:8px;border-top:1px solid var(--line)}
.sumrow.disc{color:var(--ok)}
.note{font-size:.8rem;color:var(--muted)}
.empty{text-align:center;padding:48px 10px;color:var(--muted)}
.done{text-align:center;padding:48px 10px;display:grid;gap:12px;justify-items:center}
.done .tick{width:70px;height:70px;border-radius:50%;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);display:grid;place-items:center;font-size:2rem}

.toast{position:fixed;z-index:80;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:500;font-size:.9rem;box-shadow:var(--shadow);animation:toast .3s}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}}

/* ---- Бот ---- */
.bot-fab{position:fixed;z-index:50;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:8px 18px 8px 8px;box-shadow:var(--shadow);font-weight:600}
.bot-fab .face{width:40px;height:40px;border-radius:50%;background:var(--rose);display:grid;place-items:center;color:var(--on-rose);font-family:var(--f-display);font-size:1.3rem;position:relative}
.bot-fab .face::after{content:"";position:absolute;right:0;bottom:1px;width:10px;height:10px;border-radius:50%;background:#3DD68C;border:2px solid var(--ink)}
.bot{position:fixed;z-index:55;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));height:min(600px,calc(100dvh - 120px));background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:botIn .35s cubic-bezier(.2,.7,.2,1);transform-origin:bottom right}
@keyframes botIn{from{opacity:0;transform:scale(.9)}}
.bot-head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--ink);color:var(--bg)}
.bot-head .face{width:40px;height:40px;border-radius:50%;background:var(--rose);color:var(--on-rose);display:grid;place-items:center;font-family:var(--f-display);font-size:1.3rem}
.bot-head b{display:block}
.bot-head small{opacity:.75;font-size:.78rem}
.bot-head button{margin-left:auto;background:transparent;border:0;color:inherit;font-size:1.5rem;width:36px;height:36px}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:.92rem;line-height:1.5;animation:msgIn .3s}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}}
.msg.bot-m{background:var(--surface-2);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--rose);color:var(--on-rose);border-bottom-right-radius:4px;align-self:flex-end}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25;transform:translateY(-3px)}}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start}
.quick button{border:1px solid var(--rose);color:var(--rose);background:transparent;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:500}
.quick button:hover{background:var(--rose);color:var(--on-rose)}
.recs{display:grid;gap:8px;align-self:stretch}
.rec{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg)}
.rec .thumb{width:52px;height:60px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center}
.rec .thumb svg{width:72%}
.rec b{font-size:.88rem;display:block}
.rec small{color:var(--muted);font-variant-numeric:tabular-nums}
.bot-in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.bot-in input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
.bot-in button{width:42px;height:42px;border-radius:50%;border:0;background:var(--rose);color:var(--on-rose);display:grid;place-items:center}

/* Появяване при скролване (само където браузърът го поддържа; иначе всичко си стои видимо) */
@supports (animation-timeline: view()){
  .reveal{animation:revealUp linear both;animation-timeline:view();animation-range:entry 0% entry 35%}
  @keyframes revealUp{from{opacity:.2;transform:translateY(28px)}}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .thread path{stroke-dashoffset:0}
  html{scroll-behavior:auto}
}
</style>

<body>


<div class="marquee" aria-label="Новини"><div class="marquee-track" id="marquee"></div></div>

<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="#home" aria-label="Начало">

    <nav class="main" aria-label="Основно меню">
      <a href="#collection">Колекция</a><a href="#lookbook">Лукбук</a><a href="#about">За нас</a><a href="#contact">Контакти</a>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="cartBtn" aria-label="Количка">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="count" id="cartCount">0</span>
      </button>
      <button class="icon-btn" id="menuBtn" aria-label="Меню" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
    </div>
  </div>
  <div class="mobile-nav wrap" id="mobileNav" hidden>
    <a href="#collection">Колекция</a><a href="#lookbook">Лукбук</a><a href="#about">За нас</a><a href="#contact">Контакти</a>
  </div>
</header>

<main>
  <div class="hero" id="home">
    <div class="weave" aria-hidden="true"></div>

    <div class="wrap hero-in">
      <div>
        <div class="eyebrow" style="color:var(--rose)" id="heroEyebrow"></div>
        <h1 style="margin-top:14px"><span id="heroLead"></span> <em id="heroWord"><span></span></em></h1>
        <p id="heroText"></p>
        <div class="hero-ctas">
          <a class="btn btn-rose" href="#collection" id="heroBtn1"></a>
          <a class="btn btn-line" href="#lookbook" id="heroBtn2"></a>
        </div>
      </div>
      <div class="stage" id="stage" aria-roledescription="слайдшоу">
        <div class="dots" id="dots"></div>
      </div>
    </div>
  </div>

  <section id="collection">
    <div class="wrap">
      <div class="sec-head reveal">
        <div><div class="eyebrow">Колекция</div><h2>Есен в лен</h2><p class="lead">Тринадесет модела, ушити на малки серии. Когато свършат, не ги повтаряме.</p></div>
        <div class="filters" id="filters" role="group" aria-label="Филтър по категория"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="lookbook" id="lookbook">
    <div class="wrap sec-head reveal">
      <div><div class="eyebrow">Лукбук</div><h2 id="lbTitle"></h2><p class="lead" id="lbText"></p></div>
      <div class="lb-nav"><button class="icon-btn" id="lbPrev" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><button class="icon-btn" id="lbNext" aria-label="Напред"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
    </div>
    <div class="lb-track" id="lbTrack"></div>
  </section>

  <section>
    <div class="wrap">
      <div class="launch reveal">
        <div><div class="eyebrow" id="launchLabel"></div><h2 id="launchTitle"></h2><p id="launchText"></p></div>
        <div class="clock" id="clock" aria-live="off"></div>
      </div>
    </div>
  </section>

  <section id="about" style="padding-top:0">
    <div class="wrap">
      <div class="about-in">
        <div class="reveal">
          <div class="eyebrow">За нас</div>
          <h2 id="aboutTitle"></h2>
          <p class="story" id="aboutStory"></p>
          <div class="numbers" id="numbers"></div>
          <div class="about-photos" id="aboutPhotos"></div>
        </div>
        <div class="values reveal" id="values"></div>
      </div>
      <div class="team" id="team"></div>
    </div>
  </section>

  <section id="contact" style="background:var(--surface);border-top:1px solid var(--line)">
    <div class="wrap contact-in">
      <div class="reveal">
        <div class="eyebrow">Контакти</div>
        <h2>Пиши ни, ще отговорим до един ден</h2>
        <div class="cinfo" id="cinfo"></div>
        <div class="social" id="social"></div>
      </div>
      <form class="cform reveal" id="cform" novalidate>
        <div class="two">
          <div class="field"><label for="fName">Име</label><input id="fName" required autocomplete="name"></div>
          <div class="field"><label for="fMail">Имейл</label><input id="fMail" type="email" required autocomplete="email"></div>
        </div>
        <div class="field"><label for="fTopic">Тема</label>
          <select id="fTopic"><option>Въпрос за продукт</option><option>Поръчка</option><option>Ремонт на дреха</option><option>Сътрудничество</option></select></div>
        <div class="field"><label for="fMsg">Съобщение</label><textarea id="fMsg" required></textarea></div>
        <div id="formMsg" hidden></div>
        <button class="btn btn-rose" type="submit">Изпрати съобщението</button>
      </form>
    </div>
  </section>
</main>

<footer><div class="wrap"><span id="footName"></span><span id="footNote"></span></div></footer>

<button class="bot-fab" id="botFab" aria-label="Отвори чата със стилиста"><span class="face">С</span><span id="fabLabel">Попитай стилиста</span></button>

let uid = 0;
function art(p){
  const id = "g" + (++uid), c = p.color, a = p.accent || "#fff";
  const S = SHAPES[p.type](c, a);
  const pats = {

    dots: `<pattern id="${id}p" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="2.3" fill="${a}"/></pattern>`,
    waves: `<pattern id="${id}p" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 7 q6 -6 12 0 t12 0" stroke="${a}" stroke-width="2.2" fill="none"/></pattern>`,

  };
  const defs = `<defs>
    <clipPath id="${id}c"><path d="${S.body}"/></clipPath>
    <linearGradient id="${id}s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/><stop offset=".68" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".24"/></linearGradient>
    <pattern id="${id}t" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4 L4 0" stroke="#000" stroke-opacity=".05"/><path d="M0 0 L4 4" stroke="#fff" stroke-opacity=".06"/></pattern>
    ${pats[p.pattern] || ""}
    <pattern id="${id}e" width="16" height="16" patternUnits="userSpaceOnUse" y="2"><path d="M8 1 L15 8 L8 15 L1 8 Z" fill="none" stroke="${a}" stroke-width="1.7"/><path d="M8 5 L11 8 L8 11 L5 8 Z" fill="${a}"/><circle cx="0" cy="0" r="1.6" fill="#1B2133"/><circle cx="16" cy="16" r="1.6" fill="#1B2133"/><circle cx="16" cy="0" r="1.6" fill="#1B2133"/><circle cx="0" cy="16" r="1.6" fill="#1B2133"/></pattern>

    <path d="${S.body}" fill="url(#${id}t)"/>

let cart = [], promoOn = false, discountSets = 0;
function toast(t){ const d = document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), 2200); }
function addToCart(id, size, qty=1, silent){
  const f = cart.find(x=>x.id===id && x.size===size);
  f ? f.qty += qty : cart.push({id,size,qty});
  updateCount();
  if (!silent) toast(`Добавено: ${byId(id).name}`);
}
function updateCount(){
  const n = cart.reduce((a,x)=>a+x.qty,0), el = $("#cartCount");
  el.textContent = n; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");

}
function totals(){
  const sub = cart.reduce((a,x)=>a+byId(x.id).price*x.qty,0);
  const setOff = discountSets;
  const promo = promoOn ? (sub - setOff) * C.promo.percent/100 : 0;
  const after = sub - setOff - promo;
  const del = cart.length===0 || after >= C.delivery.freeOver ? 0 : C.delivery.price;
  return {sub, setOff, promo, del, total: after + del};
}

    <div class="drawer-foot">
      <form class="promo" id="promoForm"><input id="promoIn" placeholder="Промо код" aria-label="Промо код" value="${promoOn?C.promo.code:""}"><button class="btn btn-line btn-sm" type="submit">Приложи</button></form>

let history = [];
function push(html){ history.push(html); $("#msgs").insertAdjacentHTML("beforeend", html); scrollMsgs(); }
const scrollMsgs = () => { const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight; };
const quick = items => `<div class="quick">${items.map(([a,l])=>`<button data-act="${esc(a)}">${esc(l)}</button>`).join("")}</div>`;
const mainQuick = () => [["pick","Помогни ми да избера"], ...B.faq.map((f,i)=>["faq:"+i, f.button])];
function userSay(t){ push(`<div class="msg me">${esc(t)}</div>`); }
function botSay(text, q, extra=""){
  const m = $("#msgs"); if (!m) return;
  m.insertAdjacentHTML("beforeend", `<div class="msg bot-m typing" id="typing"><i></i><i></i><i></i></div>`); scrollMsgs();
  setTimeout(() => {
    const ty = document.getElementById("typing"); ty && ty.remove();
    push(`<div class="msg bot-m">${esc(text)}</div>` + extra + (q ? quick(q) : ""));
  }, reduced ? 50 : 650 + Math.min(900, text.length*6));

function onBotClick(e){
  const ad = e.target.closest("[data-badd]");

  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act; b.parentElement.remove();
  history = history.map(h => h.includes(`data-act="${act}"`) ? h.replace(/<div class="quick">[\s\S]*<\/div>$/,"") : h);
  userSay(b.textContent);
  if (act==="pick") startFlow();
  else if (act.startsWith("faq:")) botSay(B.faq[+act.slice(4)].answer, [["pick","Помогни ми да избера"],["menu","Друг въпрос"]]);
  else if (act.startsWith("occ:")){ flow.occ = act.slice(4); botSay(B.askStyle, B.styles.map(s=>["sty:"+s.id, s.label])); }
  else if (act.startsWith("sty:")){ flow.sty = act.slice(4); recommend(); }
  else if (act==="menu") botSay("С какво друго да помогна?", mainQuick());
  else if (act==="cart"){ toggleBot(false); openCart(); }
}
function startFlow(){ flow = {}; botSay(B.askOccasion, B.occasions.map(o=>["occ:"+o.id, o.label])); }
function recommend(){
  const scored = C.products.map(p => ({p, s:(p.occasions.includes(flow.occ)?2:0) + (p.styles.includes(flow.sty)?1.5:0) + (p.badge?0.2:0)}))
    .sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.p);
  const cards = `<div class="recs">${scored.map(p=>`<div class="rec"><div class="thumb">${media(p)}</div><div><b>${esc(p.name)}</b><small>${money(p.price)}</small></div><button class="add" data-badd="${p.id}" aria-label="Добави ${esc(p.name)}">+</button></div>`).join("")}</div>`;
  botSay(B.resultIntro, [["cart","Към количката"],["pick","Нов избор"],["menu","Друг въпрос"]], cards);
  flow = null;
}
function handle(text){
  const t = text.toLowerCase();
  if (/здрав|здрасти|привет|хей|добър ден/.test(t)) return botSay(`Здравей и от мен! С какво да помогна?`, mainQuick());
  if (/благодар|мерси/.test(t)) return botSay("Моля! Пиши ми, ако имаш още въпроси.", mainQuick());
  if (/избер|препоръ|визия|подар|какво да|облека|съвет/.test(t)) return startFlow();
  const f = B.faq.find(f => f.keywords.some(k => t.includes(k)));
  if (f) return botSay(f.answer, [["pick","Помогни ми да избера"],["menu","Друг въпрос"]]);
  if (/цена|колко струва|евтин|скъп/.test(t)) return botSay(`Цените ни са от ${money(Math.min(...C.products.map(p=>p.price)))} до ${money(Math.max(...C.products.map(p=>p.price)))}. С промо код ${C.promo.code} получаваш −${C.promo.percent}%.`, mainQuick());
  botSay(B.notUnderstood, mainQuick());
}
$("#botFab").addEventListener("click", () => toggleBot(true));
})();
</script>
